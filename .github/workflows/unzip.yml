name: unzip
on:
  push:
    paths: ['.github/workflows/unzip.yml']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o redbull.zip
          git rm -q redbull.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip site"
          git push
